name: Decompile Ren'Py scripts

on:
  workflow_dispatch:
  push:
    paths:
      - '*.rpyc'
      - 'x-characters_script.zip'
      - 'x-tl.zip'
      - '.github/workflows/decompile-renpy.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download unrpyc
        run: git clone --depth 1 https://github.com/CensoredUsername/unrpyc.git tools/unrpyc

      - name: Prepare input files
        run: |
          mkdir -p work/characters work/tl work/root
          unzip -q x-characters_script.zip -d work/characters
          unzip -q x-tl.zip -d work/tl
          shopt -s nullglob
          root_scripts=( ./*.rpyc )
          if (( ${#root_scripts[@]} )); then
            cp "${root_scripts[@]}" work/root/
          fi

      - name: Decompile compiled Ren'Py scripts
        run: |
          python tools/unrpyc/unrpyc.py work/characters
          python tools/unrpyc/unrpyc.py work/tl
          if find work/root -type f -name '*.rpyc' -print -quit | grep -q .; then
            python tools/unrpyc/unrpyc.py work/root
          fi

      - name: Collect output safely
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2

          sources = [
              ("work/characters", "decompiled/characters"),
              ("work/tl", "decompiled/tl"),
              ("work/root", "decompiled/root"),
          ]
          count = 0
          for source_dir, output_dir in sources:
              source = Path(source_dir)
              output = Path(output_dir)
              for path in source.rglob("*"):
                  if path.is_file() and path.suffix in {".rpy", ".rpym"}:
                      target = output / path.relative_to(source)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      copy2(path, target)
                      count += 1
          print(f"Collected {count} source files.")
          if count == 0:
              raise SystemExit("No .rpy or .rpym source files were generated or found.")
          PY
          find decompiled -type f -print

      - name: Upload decompiled files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: renpy-decompiled-sources
          path: decompiled/
          if-no-files-found: error

      - name: Commit decompiled sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decompiled/
          if git diff --cached --quiet; then
            echo "No new decompiled files to commit."
          else
            git commit -m "Add decompiled Ren'Py source files"
            git push
          fi
