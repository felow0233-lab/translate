name: Build Russian RenPy translation scripts

on:
  push:
    paths:
      - ".github/workflows/build-russian-translation.yml"
      - "localization/game/tl/russian/strings.rpy"
      - "localization/roxy-safe-dialogue.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: russian-apk-build
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input project/game output
          gh release download apk-source --repo "${GITHUB_REPOSITORY}" --pattern "Mushoku.Tensex.3.apk" --dir input
          echo "APK=$(find input -name '*.apk' -print -quit)" >> "$GITHUB_ENV"

      - name: Extract selected game scripts
        run: |
          python - <<'PY'
          import zipfile, os, pathlib
          apk=os.environ["APK"]
          with zipfile.ZipFile(apk) as z:
            members=[
              name for name in z.namelist()
              if name.startswith("assets/x-game/")
              and name.endswith(".rpyc")
              and "/x-tl/" not in name
            ]
            if not members:
              raise SystemExit("No compiled game scripts found")
            for member in members:
              rel=member.split("assets/x-game/",1)[1]
              out=pathlib.Path("project/game")/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              with z.open(member) as src,open(out,"wb") as dst:
                dst.write(src.read())
            print("Extracted game scripts:",len(members))
          PY

      - name: Decompile source scripts
        run: |
          git clone --depth 1 https://github.com/CensoredUsername/unrpyc.git tools/unrpyc
          find project/game -name '*.rpyc' -print0 | while IFS= read -r -d '' f; do
            python tools/unrpyc/unrpyc.py "$f"
          done
          find project/game -name '*.rpyc' -delete
          python - <<'PY'
          p="project/game/x-options.rpy"
          s=open(p,encoding="utf-8-sig").read()
          marker='define config.version = "0.10.0"'
          if marker not in s: raise SystemExit("Could not find original game version setting")
          s=s.replace(marker, marker+'\n\ndefine config.language = "russian"',1)
          open(p,"w",encoding="utf-8").write(s)

          # Use Ren'Py's bundled DejaVuSans font, which supports Cyrillic.
          p="project/game/x-gui.rpy"
          s=open(p,encoding="utf-8-sig").read()
          count=s.count("Fredoka.ttf")
          if count < 3:
              raise SystemExit("Expected GUI font definitions were not found")
          s=s.replace("Fredoka.ttf", "DejaVuSans.ttf")
          open(p,"w",encoding="utf-8").write(s)
          PY

      - name: Download RenPy 8.5.2 SDK
        run: |
          wget -q https://www.renpy.org/dl/8.5.2/renpy-8.5.2-sdk.tar.bz2 -O renpy-sdk.tar.bz2
          mkdir renpy-sdk
          tar -xjf renpy-sdk.tar.bz2 -C renpy-sdk --strip-components=1
          chmod +x renpy-sdk/renpy.sh
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxcursor1 libxinerama1 libasound2t64

      - name: Generate and translate Russian scripts
        run: |
          cd renpy-sdk
          ./renpy.sh ../project translate russian --no-todo
          cd ..
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path("project/game/tl/russian")
          dialogue=json.loads(pathlib.Path("localization/roxy-safe-dialogue.json").read_text(encoding="utf-8"))
          # Read the maintained old/new string pairs from the repository's Russian UI file.
          source=pathlib.Path("localization/game/tl/russian/strings.rpy").read_text(encoding="utf-8-sig")
          lines=source.splitlines()
          strings={}
          for i,line in enumerate(lines[:-1]):
              m=re.match(r'^\s*old\s+("(?:\\.|[^"\\])*")\s*$',line)
              if not m: continue
              n=re.match(r'^\s*new\s+("(?:\\.|[^"\\])*")\s*$',lines[i+1])
              if n:
                  strings[json.loads(m.group(1))]=json.loads(n.group(1))
          files=list(root.rglob("*.rpy"))
          if not files: raise SystemExit("RenPy did not generate translation source files")
          translations={**strings,**dialogue}
          changed=0
          for path in files:
              rows=path.read_text(encoding="utf-8-sig").splitlines()
              for i,line in enumerate(rows[:-1]):
                  m=re.match(r'^(\s*old\s+)("(?:\\.|[^"\\])*")(\s*)
          PY
          cd renpy-sdk
          ./renpy.sh ../project compile
          cd ..
          test -f project/game/x-options.rpyc
          test -f project/game/x-gui.rpyc
          grep -q 'DejaVuSans.ttf' project/game/x-gui.rpy
          ! grep -q 'Fredoka.ttf' project/game/x-gui.rpy
          test -f project/game/tl/russian/x-characters_script/x-06_roxy.rpyc
          test -f project/game/tl/russian/x-screens.rpyc
          test -f project/game/tl/russian/x-script.rpyc

      - name: Patch APK with compiled Russian files
        run: |
          python - <<'PY'
          import zipfile, pathlib, shutil, os
          src=pathlib.Path(os.environ["APK"])
          out=pathlib.Path("output/Mushoku-Tensex-RU-unsigned.apk")
          tl=pathlib.Path("project/game/tl/russian")
          additions={}
          for p in tl.rglob("*.rpyc"):
              rel=p.relative_to(tl).as_posix()
              if rel == "common.rpyc": continue
              additions["assets/x-game/x-tl/x-russian/"+rel]=p
          additions["assets/x-game/x-options.rpyc"]=pathlib.Path("project/game/x-options.rpyc")
          additions["assets/x-game/x-gui.rpyc"]=pathlib.Path("project/game/x-gui.rpyc")
          if not additions["assets/x-game/x-gui.rpyc"].is_file():
              raise SystemExit("Compiled GUI script missing")
          if not any("x-characters_script/x-06_roxy.rpyc" in k for k in additions):
              raise SystemExit("Compiled Roxy translation missing")
          with zipfile.ZipFile(src,"r") as zin, zipfile.ZipFile(out,"w",allowZip64=True) as zout:
              for info in zin.infolist():
                  name=info.filename
                  if name in additions: continue
                  upper=name.upper()
                  if upper.startswith("META-INF/") and upper.endswith((".SF",".RSA",".DSA",".EC")): continue
                  if upper == "META-INF/MANIFEST.MF": continue
                  with zin.open(info) as r, zout.open(info,"w") as w:
                      shutil.copyfileobj(r,w,1024*1024)
              for name,path in additions.items():
                  info=zipfile.ZipInfo(name,date_time=(2026,11,21,16,0,0))
                  info.compress_type=zipfile.ZIP_STORED
                  with open(path,"rb") as r,zout.open(info,"w") as w:
                      shutil.copyfileobj(r,w,1024*1024)
          print("Added/replaced",len(additions),"compiled Russian files")
          print("Unsigned APK size:",out.stat().st_size)
          PY

      - name: Sign and verify APK
        run: |
          sudo apt-get install -y apksigner zipalign
          keytool -genkeypair -keystore output/ru-test.jks -storepass testpass123 -keypass testpass123 -alias ru-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mushoku Russian Test"
          zipalign -p -f 4 output/Mushoku-Tensex-RU-unsigned.apk output/Mushoku-Tensex-RU-aligned.apk
          apksigner sign --ks output/ru-test.jks --ks-pass pass:testpass123 --key-pass pass:testpass123 --out output/Mushoku-Tensex-RU-test.apk output/Mushoku-Tensex-RU-aligned.apk
          apksigner verify --verbose output/Mushoku-Tensex-RU-test.apk
          unzip -l output/Mushoku-Tensex-RU-test.apk | grep -E 'x-tl/x-russian|x-options.rpyc' | head -30

      - name: Upload test APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload apk-source output/Mushoku-Tensex-RU-test.apk --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Upload compact build report
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-russian-apk-report
          path: |
            output/Mushoku-Tensex-RU-test.apk
          if-no-files-found: error
          retention-days: 7
,line)
                  if not m: continue
                  source_text=json.loads(m.group(2))
                  if source_text in translations:
                      rows[i+1]=re.sub(
                          r'^(\s*new\s+).*
          PY
