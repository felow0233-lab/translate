              for name,path in additions.items():
                  info=zipfile.ZipInfo(name,date_time=(2026,11,21,16,0,0))
                  info.compress_type=zipfile.ZIP_STORED
                  with open(path,"rb") as r,zout.open(info,"w") as w:
                      shutil.copyfileobj(r,w,1024*1024)
          print("Added/replaced",len(additions),"compiled Russian files")
          print("Unsigned APK size:",out.stat().st_size)
          PY

      - name: Sign and verify APK
        run: |
          sudo apt-get install -y apksigner zipalign
          keytool -genkeypair -keystore output/ru-test.jks -storepass testpass123 -keypass testpass123 -alias ru-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mushoku Russian Test"
          zipalign -p -f 4 output/Mushoku-Tensex-RU-unsigned.apk output/Mushoku-Tensex-RU-aligned.apk
          apksigner sign --ks output/ru-test.jks --ks-pass pass:testpass123 --key-pass pass:testpass123 --out output/Mushoku-Tensex-RU-test.apk output/Mushoku-Tensex-RU-aligned.apk
          apksigner verify --verbose output/Mushoku-Tensex-RU-test.apk
          unzip -l output/Mushoku-Tensex-RU-test.apk | grep -E 'x-tl/x-russian|x-options.rpyc' | head -30

      - name: Upload test APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload apk-source output/Mushoku-Tensex-RU-test.apk --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Upload compact build report
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-russian-apk-report
          path: |
            output/Mushoku-Tensex-RU-test.apk
          if-no-files-found: error
          retention-days: 7
